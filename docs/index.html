<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <title>WebX</title>
    <script type="module" crossorigin src="./assets/index-BH6pLXA5.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-FpYoH7uD.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 起動ウォッチドッグ：アプリ本体（JSバンドル）が一定時間内に起動しなかったら、
      // データを消さずに復旧できる画面を出す。Service Worker やキャッシュの不整合で
      // 「PWAが開かない」状態になっても、サイトデータを全削除しなくて済むようにするため。
      window.__webxBootTimer = setTimeout(function () {
        if (window.__webxBooted) return
        var old = document.getElementById('webx-boot-fallback')
        if (old) return
        var box = document.createElement('div')
        box.id = 'webx-boot-fallback'
        box.setAttribute('style', 'position:fixed;inset:0;z-index:99999;background:#0f1522;color:#e8edf5;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;')
        box.innerHTML =
          '<div style="max-width:420px;text-align:center;">' +
          '<div style="font-size:40px;margin-bottom:12px;">🛠</div>' +
          '<div style="font-size:18px;font-weight:700;margin-bottom:10px;">WebX を起動できませんでした</div>' +
          '<p style="font-size:14px;line-height:1.7;color:#aeb9c9;margin:0 0 18px;">アプリのキャッシュが古いまま残っていると、こうなることがあります。下の「キャッシュだけ消して再読み込み」は、文書や設定などのデータには触れずに復旧を試みます。</p>' +
          '<button id="webx-boot-reload" style="display:block;width:100%;padding:12px;margin-bottom:10px;border:0;border-radius:10px;background:#2b3750;color:#e8edf5;font-size:15px;cursor:pointer;">再読み込み</button>' +
          '<button id="webx-boot-recover" style="display:block;width:100%;padding:12px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:15px;font-weight:700;cursor:pointer;">キャッシュだけ消して再読み込み（データは消えません）</button>' +
          '<details style="text-align:left;margin-top:16px;background:#131c2e;border-radius:10px;padding:10px 14px;">' +
          '<summary style="cursor:pointer;font-weight:700;font-size:13px;">手動復旧の手順（ドキュメント）</summary>' +
          '<div style="font-size:12.5px;line-height:1.8;margin-top:6px;color:#c4cfdf;">直らない場合は PC の Chrome で：F12 → Application → Service Workers で Unregister、Cache Storage の各キャッシュを Delete してから再読み込みしてください。Android は PC と USB 接続し Chrome のリモートデバイス機能から同じ操作ができます。起動できる状態ならターミナルの recover コマンドでも復旧できます。<b>「サイトデータを消去」は押さないでください（データが消えます）。</b></div>' +
          '</details>' +
          '<p id="webx-boot-status" style="font-size:12px;color:#8fa0b8;margin:14px 0 0;min-height:16px;"></p>' +
          '</div>'
        document.body.appendChild(box)
        document.getElementById('webx-boot-reload').addEventListener('click', function () { location.reload() })
        document.getElementById('webx-boot-recover').addEventListener('click', function () {
          var status = document.getElementById('webx-boot-status')
          status.textContent = 'キャッシュを消しています…'
          var jobs = []
          if (window.caches) {
            jobs.push(caches.keys().then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k) })) }).catch(function () {}))
          }
          if (navigator.serviceWorker) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister() })) }).catch(function () {}))
          }
          Promise.all(jobs).then(function () { location.reload() })
          setTimeout(function () { location.reload() }, 3000)
        })
      }, 12000)
    </script>
  </body>
</html>
